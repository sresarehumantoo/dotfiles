name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# A newer push to the same branch/PR cancels the in-flight run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (fmt · vet · build · test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod # tracks the version declared in go.mod
          cache: true

      - name: gofmt -s check
        run: make fmt-check

      - name: go vet
        run: make lint

      - name: Build dfinstall + MCP binaries
        run: |
          make build
          make build-mcp

      - name: Test
        run: make test

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Scope to the directories that hold standalone bash scripts. A repo-wide
      # scan would also pull in config/shell/ — zsh files (p10k.zsh, zshrc, *.zsh)
      # and shebang-less rc files (profile, bashrc) that ShellCheck can't parse.
      # -x + --source-path=SCRIPTDIR lets the devtools scripts' dynamic
      # $(dirname "${BASH_SOURCE[0]}")/_lib.sh source resolve.
      - name: ShellCheck (devtools)
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=SCRIPTDIR
        with:
          scandir: config/devtools

      - name: ShellCheck (bootstrap)
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x --source-path=SCRIPTDIR
        with:
          scandir: bootstrap
