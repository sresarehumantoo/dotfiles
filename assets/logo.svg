  <!-- wordmark -->
  <text x="332" y="150" font-family="Helvetica,Arial,sans-serif" font-size="78" font-weight="800" fill="url(#word)" letter-spacing="-2">dfinstall</text><text x="336" y="188" font-family="monospace" font-size="18" fill="#73DACA">symlink <tspan fill="#565F89">&#183;</tspan> install <tspan fill="#565F89">&#183;</tspan> converge</text><text x="336" y="214" font-family="monospace" font-size="13.5" fill="#565F89">one command, every machine stays identical</text><g><rect x="336" y="234" width="62" height="26" rx="13" fill="none" stroke="#565F89" stroke-width="1.5"/><text x="367.0" y="252" font-family="monospace" font-size="13" fill="#C0CAF5" text-anchor="middle">Linux</text></g><g><rect x="406" y="234" width="54" height="26" rx="13" fill="none" stroke="#565F89" stroke-width="1.5"/><text x="433.0" y="252" font-family="monospace" font-size="13" fill="#C0CAF5" text-anchor="middle">WSL</text></g><g><rect x="468" y="234" width="64" height="26" rx="13" fill="none" stroke="#565F89" stroke-width="1.5"/><text x="500.0" y="252" font-family="monospace" font-size="13" fill="#C0CAF5" text-anchor="middle">macOS</text></g>
