version: 2

project_name: dfinstall

before:
  hooks:
    - go mod verify
    - scripts/release/content.sh {{ .Tag }} build/content

# Each binary is built twice: once for the release archives (which the
# Homebrew formula also installs) and once for the .deb, because the install
# channel is stamped in at build time and decides what `dfinstall update` does
# with the binary. A Homebrew install is told apart at run time by its Cellar
# path. The formula is generated by scripts/release/brew-formula.sh rather than
# GoReleaser, whose formula support is deprecated in favor of casks, which
# quarantine the binary they download.
builds:
  - &build
    id: dfinstall
    main: ./cmd/dfinstall
    binary: dfinstall
    env: [CGO_ENABLED=0]
    goos: [linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X github.com/sresarehumantoo/dotfiles/v2/internal/core.Version={{ .Tag }}
      - -X github.com/sresarehumantoo/dotfiles/v2/internal/core.Channel=release
  - <<: *build
    id: dfinstall-mcp
    main: ./cmd/dfinstall-mcp
    binary: dfinstall-mcp
  - <<: *build
    id: dfinstall-deb
    goos: [linux]
    ldflags: &debldflags
      - -s -w
      - -X github.com/sresarehumantoo/dotfiles/v2/internal/core.Version={{ .Tag }}
      - -X github.com/sresarehumantoo/dotfiles/v2/internal/core.Channel=deb
  - <<: *build
    id: dfinstall-mcp-deb
    main: ./cmd/dfinstall-mcp
    binary: dfinstall-mcp
    goos: [linux]
    ldflags: *debldflags

archives:
  - id: release
    ids: [dfinstall, dfinstall-mcp]
    formats: [tar.gz]
    # modules.releaseArchiveName looks for exactly this name to self-update.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]
  # The config/ tree and its stamp, for installs that have no clone. The
  # .deb carries the same files under /usr/share/dfinstall.
  - id: content
    meta: true
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}-content_{{ .Version }}"
    # One top directory: Homebrew skips dotfiles when it looks for one, and
    # would otherwise change into config/ and lose the stamp beside it.
    wrap_in_directory: true
    files:
      - src: build/content/config/**/*
        dst: config
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"
      - src: build/content/.dfinstall-content.json
        strip_parent: true
        info:
          owner: root
          group: root
          mtime: "{{ .CommitDate }}"

checksum:
  name_template: checksums.txt

nfpms:
  - id: deb
    ids: [dfinstall-deb, dfinstall-mcp-deb]
    package_name: dfinstall
    file_name_template: "{{ .PackageName }}_{{ .Version }}_{{ .Arch }}"
    formats: [deb]
    vendor: SREsAreHumanToo
    maintainer: SREsAreHumanToo <88474954+sresarehumantoo@users.noreply.github.com>
    homepage: https://github.com/sresarehumantoo/dotfiles
    description: Dotfiles installer and manager
    license: MIT
    section: utils
    bindir: /usr/bin
    dependencies: [git, curl]
    contents:
      - src: build/content/config
        dst: /usr/share/dfinstall/config
        type: tree
      - src: build/content/.dfinstall-content.json
        dst: /usr/share/dfinstall/.dfinstall-content.json

release:
  prerelease: auto

changelog:
  disable: true
