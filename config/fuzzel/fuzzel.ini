# fuzzel — managed by dfinstall (modules/sway.go), linked to ~/.config/fuzzel/fuzzel.ini
#
# The launcher behind $mod+d (config/sway/config). Until this file existed it
# ran on upstream defaults: Solarized colors, 30 characters wide, `> ` for a
# prompt, and the `hicolor` icon theme — which is the *fallback* theme and ships
# almost no application icons, so the list rendered as bare text.
#
# That mattered more than it sounds. Every other surface on this desktop is
# something you glance at; this is the one you summon and then look straight at.
# It is this desktop's Spotlight, so it is styled to match the waybar pills
# rather than to match fuzzel.
#
# Reload: none. fuzzel reads this file on each invocation, so an edit is live on
# the next $mod+d. Check a change with `fuzzel --check-config`.
#
# ⚠ Colors are RRGGBBAA — eight digits, no leading '#'. A six-digit value is a
# parse error, and fuzzel then falls back to its own defaults for the WHOLE
# [colors] section, not just the bad key.

[main]
# Cantarell first, IosevkaTerm second. This is the same split the calendar panel
# uses (config/sway/sway-calendar): the desktop's real UI font for text, with the
# Nerd Font behind it purely so the Plane-15 prompt glyph below resolves —
# Cantarell has no private-use glyphs at all and would render it as tofu.
# fcft walks this list in order per-codepoint, so the two never fight.
#
# ⚠ THE TWO SIZES ARE NOT A TYPO AND MUST BE TUNED TOGETHER. fcft does not
# scale a fallback face to the primary's metrics, so the sizes are independent
# and the Material glyph below is drawn at the size given HERE. Measured against
# the rendered cap height of the Cantarell text beside it: :size=12 draws the
# magnifier at roughly half the text height (visibly a different, smaller
# object), :size=16 is still short, :size=20 matches. Re-measure from a
# screenshot if either size changes — this is not judgeable from the numbers.
font=Cantarell:size=13,IosevkaTerm Nerd Font:size=20
use-bold=yes
dpi-aware=no

# md-magnify, from the same Material Design set as every icon in the bar.
#
# ⚠ THERE ARE TWO `prompt` KEYS IN THIS FILE and they are unrelated: this one is
# the prompt STRING, the one in [colors] is the prompt COLOR. A careless
# `sed -i 's/^prompt=.*/.../'` rewrites both and silently corrupts the palette —
# done once while tuning this very line. Anchor any edit to its section.
#
# The quoting is load-bearing: fuzzel trims trailing spaces from an unquoted
# prompt. Four, not one — the glyph is set well above the text size above, so it
# needs proportionally more clearance before the cursor or the two collide.
prompt="󰍉    "
placeholder=Search

icons-enabled=yes
# ⚠ Case-sensitive, and `hicolor` (the default) is not a real theme — it is the
# spec's fallback namespace. Adwaita is the only full theme installed here;
# check `ls /usr/share/icons` before changing this, because a missing theme
# silently degrades to no icons rather than erroring.
icon-theme=Adwaita

# fzf-style matching: subsequence, but scored so that a match at a word boundary
# beats one mid-word. `fuzzy` allows typos (Levenshtein) and in practice surfaces
# unrelated entries near the top; `exact` is what the old default did.
match-mode=fzf
sort-result=yes
fields=name,generic,comment,categories,keywords

# Desktop entries with Terminal=true. Default is "$TERMINAL -e", and TERMINAL is
# not set in a GDM-started sway session, so those entries launched nothing.
terminal=ghostty -e

# Geometry ------------------------------------------------------------------
# Centerd, which is the Spotlight position — GNOME's overview search is anchored
# top, but nothing else here is top-anchored and the bar already owns that edge.
anchor=center
# `width` is in CHARACTERS, not pixels, and is measured against the font above.
# 40 with a proportional face is a comfortable line without becoming a slab.
width=40
lines=12
horizontal-pad=24
vertical-pad=18
inner-pad=12
line-height=28

# Disables the oversized preview icon fuzzel draws when only a few entries match.
# It is a nice touch in isolation but it makes the window change shape as you
# type, which is exactly the twitch the bar's min-widths exist to prevent.
image-size-ratio=1

# Above waybar. `top` would put the launcher *under* the bar's pills, since the
# bar is a top-layer surface too and was mapped first.
layer=overlay
exit-on-keyboard-focus-loss=yes

# Catppuccin Mocha, same constants as config/waybar/style.css --------------
#
# ⚠ `background` alpha is deliberately high (0.90) because there is NO BLUR
# behind this window today — plain sway cannot blur a layer surface at any
# setting. Over a busy wallpaper a lower alpha reads as "unreadable", not as
# "glass". If SwayFX ever lands, this is one of the values that drops (to
# ~0.55) at the same time as the waybar pill alphas, and not before.
[colors]
# ⚠ SAME MATERIAL AS THE BAR AND THE PANEL — see config/waybar/style.css. These
# were Catppuccin surface tones (#181825 fill, #313244 selection, a blue match
# color), which predate the desktop moving to a dark pigment plus a lit edge
# and left the launcher looking like a different application from its
# surroundings.
#
# ⚠ background alpha stays HIGH (0.90). Copying the bar's 0.60 would be wrong:
# the bar is genuinely blurred so a low alpha reads as glass, whereas blur on a
# panel-sized surface is not dependable here — measured on swaync, it spills
# ~60px past the edge — so anything showing through this arrives SHARP, and a
# launcher over a busy wallpaper needs its text to win.
background=0b0b11e6
text=cdd6f4ff
prompt=6c7086ff
placeholder=6c7086ff
input=cdd6f4ff
# ⚠ The matched characters used to be @blue. @blue is now unused by every
# resting state on this desktop and a launcher is not the place to reintroduce
# it — brightness carries the match instead: ordinary text at @text, matched
# characters at full white. Same trick the workspace row uses for occupied vs
# empty.
match=ffffffff
selection=cdd6f41a
selection-text=cdd6f4ff
selection-match=ffffffff
counter=6c7086ff
# Matches the bar's @glass-edge — the hairline is what says "glass".
border=cdd6f44d

[border]
# 16px matches the waybar pill radius so the two read as the same material.
radius=16
width=1
