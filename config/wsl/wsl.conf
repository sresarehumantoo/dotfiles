[boot]
systemd=true
# NO `command=sysctl -p ...` here. With systemd=true, systemd-sysctl.service
# ("Apply Kernel Variables") already applies every drop-in in /etc/sysctl.d/,
# which is where the wsl module installs 99-wsl.conf. The boot command was
# doing the same work a second time. Verified from the unit and sysctl.d(5).

[automount]
enabled=true
root=/mnt/
options="metadata,umask=22,fmask=11"
mountFsTab=true

[network]
generateHosts=true
generateResolvConf=true

[interop]
enabled=true

# ⚠ FALSE ON PURPOSE, AND IT IS NOT SAFE TO FLIP BACK WITHOUT READING THIS.
#
# The default (true) appends the whole Windows PATH — typically 15-40 entries
# under /mnt/c — to $PATH. Every one of those is drvfs, i.e. 9p, i.e. a
# round trip across the VM/host boundary per stat(). That alone is survivable;
# what makes it a *typing* problem is the plugin set this repo installs:
# zsh-syntax-highlighting (zshrc) does a command lookup for each word as you
# type, and zsh-autosuggestions searches on every keystroke. Each lookup miss
# walks the entire PATH, so the per-keystroke cost scales with the number of
# 9p directories on it. Upstream: microsoft/WSL#4234, prezto#1820.
#
# ⚠ Turning interop paths off breaks things unless the shims exist. The wsl
# module's own hasInterop()/resolveWinHome() used to resolve `cmd.exe` off this
# PATH, and demorec / wsl-restart / wsl-resize-disk call powershell.exe,
# tasklist.exe, taskkill.exe and wsl.exe by bare name. So `install wsl` now:
#   1. resolves System32 via `wslpath` — a native Linux ELF that needs no
#      interop, so it works even with this set to false and nothing on PATH;
#   2. writes verified shims to ~/.local/bin/<name>.exe, each one execing the
#      absolute Windows path it confirmed exists at install time.
# Nothing is added back to PATH: ~/.local/bin is already on it and lives on
# ext4, so command lookup never touches 9p at all. That is strictly faster
# than re-adding even the two or three System32 directories by hand.
#
# To go back to stock behaviour: set this to true and run
# `dfinstall uninstall wsl` (or delete ~/.local/bin/*.exe) so the shims don't
# shadow the real PATH entries. Then `wsl.exe --shutdown`.
appendWindowsPath=false

[user]
# ⚠ RENDERED AT INSTALL TIME. The placeholder on the last line of this section
# is replaced with the account running the installer, and the whole key is
# OMITTED if that cannot be determined (WSL then falls back to the distro's
# initial user, which is the correct default).
#
# Do NOT name the placeholder token in this prose: substitution is a plain
# ReplaceAll, so a second mention gets rewritten too and the comment ends up
# stating something false about itself.
#
# This used to read `default=owen` literally. Same bug class as the hardcoded
# memory/processors in wslconfig, but with worse consequences: this key decides
# which account WSL logs into, so shipping one machine's username to another
# host names a user that may not exist there.
@DEFAULT_USER@

[time]
useWindowsTimezone=true
