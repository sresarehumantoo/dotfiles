# -- General -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
# tmux-256color's terminfo advertises neither truecolor, styled underlines, nor
# the cursor-shape caps. Add them so apps inside tmux (nvim) get full color,
# undercurl diagnostics, and a cursor that changes shape per-mode AND is
# restored cleanly when the pane is refocused.
set -as terminal-features ",*:RGB,*:usstyle"
set -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[ q"

set -g history-limit 50000
set -g mouse on
set -g focus-events on
set -g set-clipboard on
set -sg escape-time 0
set -g repeat-time 600

# Start windows and panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Activity
setw -g monitor-activity on
set -g visual-activity off
set -g display-time 2000

# -- Prefix --------------------------------------------------------------------

unbind C-b
set -g prefix M-a
bind M-a send-prefix

# -- Vi mode -------------------------------------------------------------------

set -g status-keys vi
set -g mode-keys vi

# -- Keybindings ---------------------------------------------------------------

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# Windows (tabs) — Alt+n new, Alt+1-9 switch, C-q kill
bind -n M-n new-window -c "#{pane_current_path}"
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n C-q kill-window

# Panes — Alt+Enter vsplit, Alt+- hsplit, Alt+q kill, Alt+m zoom, Alt+s break
# Alt+- (was Alt+|): `|` is Shift+\, and that Alt+Shift combo isn't forwarded
# reliably by some terminals (e.g. Ghostty), so the split stopped firing. Alt+-
# needs no Shift. Behavior unchanged: -v = top/bottom stack.
bind -n M-Enter split-window -h -c "#{pane_current_path}"
bind -n 'M--' split-window -v -c "#{pane_current_path}"
bind -n M-q kill-pane
bind -n M-m resize-pane -Z
bind -n M-s break-pane

# Swap windows
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Vim-style pane navigation.
# Not `-r`: a repeatable bind keeps a `repeat-time` window open after switching
# panes, during which tmux swallows the next h/j/k/l — so the first vim motion
# in the focused pane gets eaten. Plain binds pass that keystroke straight through.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Enter copy mode with Alt+c. -H hides the floating position indicator in the
# pane's top right; those numbers live in the status bar instead (see
# status-right, which also explains why they had to move).
# ⚠ ALL FOUR entry points need -H, or whether the overlay appears depends on
# how copy mode was entered. WheelUpPane is the easy one to miss and the one
# most used. The last three restate tmux 3.5a's own defaults with -H added —
# re-derive them from `list-keys -T root` / `-T prefix` if a tmux upgrade
# changes them, rather than assuming these are still faithful.
bind -n M-c copy-mode -H
bind [ copy-mode -H
bind PPage copy-mode -uH
bind -n WheelUpPane if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -eH }

# Copy-mode vim bindings
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi C-a send-keys -X start-of-line
bind -T copy-mode-vi C-e send-keys -X end-of-line

# Mouse toggle
bind m set -g mouse \; display "mouse #{?mouse,on,off}"

# -- Theme (colors) ------------------------------------------------------------

# One dark surface, four text weights, ONE accent — the same language as the
# waybar/sway desktop (see docs/sway.md): selection is a change of PIGMENT plus
# one lit element, never a saturated fill. The bar this replaced was the 2016
# powerline look: a four-step blue gradient on the right (#678b9e -> #81a2be ->
# #a3bcd0 -> #c5c8c6) plus a *second*, unrelated blue (#3465a4) for PREFIX and
# every copy-mode surface. Two blues fighting, and the #3465a4 one was not just
# loud but illegible — it carried #303030 text, measured 2.23:1, against the
# 4.5:1 floor everything else in this repo is held to. It is now 7.51:1.
#
# Greys stay NEUTRAL rather than adopting Catppuccin's hexes, because tmux is
# drawn inside Ghostty and config/ghostty/config sets `background = #222222`.
# A #1e1e2e bar would sit faintly purple against a neutral terminal. If Ghostty
# ever moves to Catppuccin, move these with it — the structure is unchanged,
# only the values below.
BAR_BG="terminal"  # ⚠ THE BAR STRIP IS TRANSPARENT — the terminal's own
                   # default background, not a colour. This is not only an
                   # aesthetic choice (it is waybar's floating-islands
                   # design); it is what makes the bar sit flush on the
                   # window's bottom edge. Ghostty's grid rarely divides the
                   # window height exactly, and the leftover pixels below the
                   # last row are painted with the DEFAULT background — while
                   # `background-opacity` applies only to default-background
                   # cells. So a bar with an explicit colour was opaque over a
                   # translucent strip and read as floating above the edge.
                   # With bg=terminal the bar and that strip are the same
                   # material and the seam cannot exist. See the long note in
                   # config/ghostty/config for the measurements, and for why
                   # `window-padding-color = extend-always` is NOT the fix.
PANEL="#262626"    # menus and popups, which do need a solid surface
SURF="#333333"     # the two pills — left (distro + windows), right (readouts)
CHIP="#1c1c1c"     # the current window, RECESSED into the left pill (see below)
DIM="#6c6c6c"      # SEPARATORS ONLY — the · and │. Not legible as text, and is
                   # not asked to be: at 2.41:1 on SURF it is decoration.
MUTED="#a0a0a0"    # inactive window names. ⚠ Sized against SURF (4.83:1), NOT
                   # against BAR_BG — the window list moved onto the pill when
                   # the pill was introduced, and reusing DIM here (the obvious
                   # move, since that is what the flat bar used) put navigable
                   # text at 2.41:1. The bar this replaced managed 4.63:1.
FG="#a8a8a8"       # readouts
BRIGHT="#e0e0e0"   # values worth reading: current window name, user
ACCENT="#8dc3f1"   # the ONE lit thing. Current window index, PREFIX, current
                   # search match. Nothing at rest is allowed to use it.
SLATE="#3a4356"    # transient overlay pigment: selection, messages, matches
ALERT="#f8747e"    # interrupt only — a bell

# The current window is DARKER than the pill it sits in, not lighter. That is
# waybar's `@glass-tint` logic (a dark pigment deepens the pill; a lit edge —
# here the accent-coloured index — says "this one"), and it also measures
# better: CHIP against SURF separates by 23 luminance steps, where a lighter
# #404040 chip managed only 13. docs/sway.md's note that a chip below ~+20
# dissolves into its pill applies verbatim.

set -g pane-border-style "fg=#2f2f2f"
set -g pane-active-border-style "fg=#4f5666"
set -g display-panes-colour "$DIM"
set -g display-panes-active-colour "$ACCENT"

# Messages render on status line 0 — the transparent spacer below — so a
# message reads as a band floating above the bar rather than replacing it.
set -g message-style "fg=$BRIGHT,bg=$SLATE"
set -g message-command-style "fg=$ACCENT,bg=$SLATE,bold"

# Menus and popups were never themed here at all and sat on tmux's defaults:
# `menu-selected-style bg=yellow,fg=black`.
set -g menu-style "fg=$FG,bg=$PANEL"
set -g menu-selected-style "fg=$BRIGHT,bg=$SLATE,bold"
set -g menu-border-style "fg=$SURF"
set -g menu-border-lines rounded
set -g popup-style "fg=$FG,bg=$PANEL"
set -g popup-border-style "fg=$SURF"
set -g popup-border-lines rounded

# Copy mode has FOUR surfaces and they must stay distinguishable. The three
# below were also on tmux defaults — `bg=cyan`, `bg=magenta`, `bg=red` — which
# is most of why copy mode looked unrelated to everything else.
#   mode-style               the selection you are dragging out, and the
#                            [0/50000] position counter (tmux styles both from
#                            this one option — they cannot be separated)
#   copy-mode-match-style    every search hit: accent TEXT on slate, quiet
#   copy-mode-current-match  the hit you are on: an accent FILL. The only
#                            saturated thing on screen, and only ever one run
#                            of cells at a time — the same exemption urgent
#                            gets in the waybar CSS.
set -g mode-style "fg=$BRIGHT,bg=$SLATE"
setw -g copy-mode-match-style "fg=$ACCENT,bg=$SLATE"
setw -g copy-mode-current-match-style "fg=$CHIP,bg=$ACCENT,bold"
setw -g copy-mode-mark-style "fg=$CHIP,bg=$BRIGHT"

# Clock
setw -g clock-mode-colour "$ACCENT"
setw -g clock-mode-style 24

# -- Status bar ----------------------------------------------------------------

set -g status-interval 5
set -g status-position bottom
set -g status 2
set -g status-style "fg=$FG,bg=$BAR_BG"

# Line 0 (top, next to pane): transparent spacer
set -g 'status-format[0]' '#[bg=terminal,fill=terminal] '

# Line 1 (bottom): real status bar — uses default template so status-left/right/window-status apply
set -g 'status-format[1]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Left pill: distro icon and the window list share ONE surface, the way the
# launcher chip and the workspace row share waybar's left pill. status-left
# therefore does NOT close with a separator — it hands its background straight
# to window-status-format, and the pill is closed by whichever window carries
# `window_end_flag`.
set -g status-left-length 40
set -g status-left "#[fg=$SURF,bg=$BAR_BG]#[fg=$ACCENT,bg=$SURF,bold] #(cat ~/.config/dfinstall/distro-icon 2>/dev/null)  #[nobold]"

# Right pill: one chip holding every readout, dim dots between them — replacing
# four separate powerline chips that stepped from #678b9e to near-white. The
# pill is opened ONCE and the COPY and PREFIX chips prepend inside it, so
# nothing on the bar moves when either fires; only the pill grows leftward.
#
# COPY is tmux's copy-mode position indicator, relocated. In the pane it is a
# box floating over the top-right of your content, and its ONLY styling knob is
# mode-style — which also governs the selection highlight, so it cannot be
# quietened without quietening selection too. Moving it here is the only way to
# style it in this file's language; it also gains the search-hit count, which
# the overlay shows only while a search is live.
# ⚠ This tracks copy-mode movement LIVE despite `status-interval 5` — tmux
# redraws the status on mode movement, not on the timer. Verified by setting
# the interval to 60 and scrolling: the position still updated per keystroke.
# So do not "fix" a perceived lag by lowering status-interval.
#
# The `#,` escapes are commas belonging to the text, not to #{?:} arguments.
# ⚠ The nested #{?search_present,...} deliberately carries NO #[...] directive:
# escaping is per nesting level, and a style's own commas inside a doubly
# nested conditional is where this becomes unwriteable. Set the style before
# the conditional and let the conditional emit plain text.
set -g status-right-length 120
set -g status-right "#[fg=$SURF,bg=$BAR_BG]#[bg=$SURF] #{?pane_in_mode,#[fg=$ACCENT#,bold]COPY #[fg=$FG#,nobold]#{scroll_position}/#{history_size}#{?search_present, · #{search_count} hits,} #[fg=$DIM]│ ,}#{?client_prefix,#[fg=$ACCENT#,bold]PREFIX #[fg=$DIM#,nobold]│ ,}#[fg=$FG,bg=$SURF]%R #[fg=$DIM]· #[fg=$FG]%d %b #[fg=$DIM]· #[fg=$FG]#{?#{==:#{pane_current_path},#{HOME}},~,#{=/24/..:#{b:pane_current_path}}} #[fg=$DIM]· #[fg=$BRIGHT,bold]#(whoami) #[fg=$SURF,bg=$BAR_BG,nobold]"

# Window status. Both formats close the left pill on `window_end_flag` and only
# there — a separator after every window would cut the pill into chips again,
# which is the look this replaced. The current window needs a separator on BOTH
# sides because its background differs from the pill's, and its trailing one
# has to know whether it is handing back to the pill or ending it.
# ⚠ THE PILL CAPS ARE HALF-CIRCLES (U+E0B6 opens a segment, U+E0B4 closes it),
# WHICH INVERT THE COLOUR RULE THE POWERLINE ARROWS USED. An arrow is a wedge
# whose FILL is the segment on its LEFT, so an arrow separator is
# `fg=<left segment bg>, bg=<right segment bg>`. A half-circle is a cap belonging
# to ONE segment, so it is `fg=<that segment bg>, bg=<what it sits on>` — both
# operands swap. Getting this backwards does not look like wrong colours, it
# looks like a broken glyph: the cap detaches from its chip and reads as a stray
# blob on the pill. That happened once already with the arrows, which is why the
# rule is written down rather than left to be re-derived.
# Shape choice is not decoration: the desktop's waybar pills are rounded
# (16px radius), so half-circles are what actually matches them; the arrows were
# powerline convention inherited from the bar this replaced. Cost is 4 cells,
# one per pill end.
#
# The last-window marker (prefix + l) is an underscore applied INSIDE the
# format, around #W alone — not via `window-status-last-style`. That option
# styles the whole status range, so the underline ran under the chip's padding
# too and read as an underlined block rather than an underlined label. Only
# non-current windows use this format, and `last` is never current, so the
# conditional cannot fire on the wrong one.
setw -g window-status-format "#[fg=$MUTED,bg=$SURF] #I #{?window_last_flag,#[underscore],}#W#[nounderscore]#{?window_bell_flag, !,}#{?window_zoomed_flag, Z,} #{?window_end_flag,#[fg=$SURF#,bg=$BAR_BG],}"
setw -g window-status-current-format "#[fg=$CHIP,bg=$SURF]#[fg=$ACCENT,bg=$CHIP,bold] #I #[fg=$BRIGHT]#W#{?window_zoomed_flag, Z,} #[nobold]#{?window_end_flag,#[fg=$CHIP#,bg=$BAR_BG],#[fg=$CHIP#,bg=$SURF]}"
# Activity lifts an inactive window from MUTED to BRIGHT — the quiet step below
# a bell, and hue-free, so it cannot be confused with the accent. It stays
# distinct from the current window, which is marked by the CHIP recess and the
# accent index rather than by text weight. ⚠ Do not set this to FG: FG and
# MUTED are eight steps apart and the change would be invisible.
# The bell is the only saturated colour left in the bar, and it no longer
# blinks: an animated status bar is exactly what this theme is getting away
# from, and ALERT bold is already the loudest thing on the line.
# ⚠ Explicitly UNSET, not merely omitted. `source-file` (what prefix + r
# runs) only ever *sets* options — deleting a line leaves the old value
# live on every already-running server, so dropping the previous
# `window-status-last-style "underscore"` left the block underline on
# screen and made the change above look like it had not applied. Anything
# removed from this file needs a -u line here for a reload to converge.
setw -gu window-status-last-style
setw -g window-status-activity-style "fg=$BRIGHT"
setw -g window-status-bell-style "fg=$ALERT,bold"
setw -g window-status-separator ""

# -- Plugins (TPM) -------------------------------------------------------------

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-logging'

# Keyboard `y` should copy without bouncing out of copy-mode, but the highlight
# should clear. tmux-yank loads after the copy-mode-vi binds above and rebinds
# `y` itself, so it — not the line-92 copy-selection — owns both the keyboard
# `y` and the mouse drag. copy-pipe = copy + clear selection + stay (vs
# -and-cancel, which exits, and -no-clear, which leaves the highlight up).
# @yank_action drives BOTH paths; the mouse is split back out below (after TPM).
set -g @yank_action 'copy-pipe'

# Resurrect/continuum settings
# Auto-restore is OFF by default — restoring captured pane contents at every
# tmux server start clobbers in-progress output (test runs, tail -f, etc.).
# Toggle with the `tmux-restore` script: it manages the marker file below.
# Manual restore is still available via prefix + Ctrl-r.
set -g @continuum-restore 'off'
set -g @resurrect-capture-pane-contents 'on'
if-shell '[ -f ~/.config/tmux/restore-on ]' "set -g @continuum-restore 'on'"

# Logging settings — save logs to ~/.local/share/tmux/logs
set -g @logging-path '#{HOME}/.local/share/tmux/logs'
set -g @screen-capture-path '#{HOME}/.local/share/tmux/logs'
set -g @save-complete-history-path '#{HOME}/.local/share/tmux/logs'

# Initialize TPM (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

# Mouse drag copies AND exits copy-mode — only the keyboard `y` stays put.
# tmux-yank binds both to @yank_action (copy-pipe = stay), so this re-binds the
# mouse release after the plugin has loaded. set-clipboard on (above) carries
# the selection to the system clipboard over OSC 52, the same destination as
# tmux-yank's pipe.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
