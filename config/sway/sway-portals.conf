# xdg-desktop-portal routing under sway — managed by dfinstall (modules/sway.go).
# Linked to ~/.config/xdg-desktop-portal/sway-portals.conf
#
# The filename must match XDG_CURRENT_DESKTOP lowercased: the packaged
# /usr/share/wayland-sessions/sway.desktop sets `DesktopNames=sway`, so this
# file applies under sway ONLY. GNOME keeps its own routing untouched, which
# is what makes GNOME a clean rollback (and the working deskflow path).
#
# Verify in a sway session:
#   env | grep XDG_CURRENT_DESKTOP        # -> sway
#   systemctl --user status xdg-desktop-portal
#
# NOTE: xdg-desktop-portal-wlr provides ScreenCast + Screenshot only. It still
# does NOT implement RemoteDesktop (upstream issue #2, open since 2019), so
# input-injection tools such as deskflow cannot use it. RemoteDesktop is
# therefore routed to xdg-desktop-portal-luminous instead — see below.

[preferred]
default=wlr;gtk
# Settings (theme, font, colour-scheme) has no wlr implementation; the GTK
# backend serves it so apps still pick up the dark/light preference.
org.freedesktop.impl.portal.Settings=gtk
# File chooser likewise — wlr has none, GTK gives a real dialog.
org.freedesktop.impl.portal.FileChooser=gtk

# RemoteDesktop: the deskflow client's only injection path on Wayland is
# libei + RemoteDesktop's ConnectToEIS. luminous implements RemoteDesktop v2
# with ConnectToEIS and lowers EIS events onto zwlr_virtual_pointer_v1 +
# zwp_virtual_keyboard_v1, both of which sway already binds.
#
# ⚠ luminous's Start() returns Success with NO consent dialog — any local app
# can acquire input injection. Accepted deliberately (see sway-migration
# PLAN.md phase 6); the exposure is narrowed by luminous.portal's UseIn=sway
# and by ConditionEnvironment=XDG_CURRENT_DESKTOP=sway on its systemd unit, so
# it can never come up under GNOME. GNOME keeps its prompt-gated mutter path
# and stays the clean rollback.
#
# Routed per-interface rather than by adding luminous to default= so that
# ScreenCast/Screenshot stay on the proven wlr backend.
org.freedesktop.impl.portal.RemoteDesktop=luminous
# Clipboard is session-scoped onto the RemoteDesktop session, so it has to be
# the same backend; wlr has no Clipboard implementation anyway.
org.freedesktop.impl.portal.Clipboard=luminous
