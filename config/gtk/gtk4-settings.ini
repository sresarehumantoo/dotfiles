# GTK4 settings — managed by dfinstall (modules/sway.go), linked to ~/.config/gtk-4.0/settings.ini
#
# The GTK4 half of config/gtk/gtk3-settings.ini; read that file's header first,
# the reasoning is all there. This one is shorter because GTK4 ignores most of
# it.
#
# ⚠ WHAT THIS FILE CAN AND CANNOT DO. GTK4 apps split into two kinds:
#
#   · plain GTK4 (no libadwaita) — honours gtk-application-prefer-dark-theme
#     below, so for those this file is the whole fix.
#   · libadwaita — IGNORES it. libadwaita resolves light/dark ONLY from the
#     xdg-desktop-portal Settings interface (org.freedesktop.appearance
#     color-scheme), and under sway that is served by xdg-desktop-portal-gtk
#     reading the GSettings key. So libadwaita apps are fixed by the
#     `gsettings set` block in config/sway/config, not by anything here.
#
# gtk-theme-name is deliberately absent: libadwaita does not load GTK themes at
# all, and naming one for plain GTK4 apps would apply a GTK3-shaped theme they
# were never styled against.

[Settings]
gtk-application-prefer-dark-theme=1

gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

gtk-decoration-layout=:close
