# GTK3 settings — managed by dfinstall (modules/sway.go), linked to ~/.config/gtk-3.0/settings.ini
#
# WHY THIS EXISTS
#   Every dialog this desktop hands off to is GTK3 — pavucontrol (volume module,
#   right click), nm-connection-editor (network module, right click),
#   blueman-manager (swaync's button grid), plus every GTK file chooser. With no
#   settings source they render in Adwaita LIGHT: a white window against a
#   Catppuccin Mocha desktop, which is the single most jarring thing left on it.
#
#   Under GNOME that never happens, because gnome-settings-daemon supplies these
#   values. sway has no settings daemon, so nothing does — GTK3 falls back to
#   this file, which is exactly the gap it is for.
#
# ⚠ SCOPE: this is a PER-USER file, not a per-session one. It is read under
#   GNOME too. That is harmless here because GNOME's own settings source takes
#   priority over settings.ini, so GNOME keeps deciding for itself and stays the
#   clean rollback (same principle as config/sway/sway-portals.conf).
#
# ⚠ THIS FILE DOES NOT COVER GTK4/libadwaita APPS. Those ignore settings.ini for
#   appearance and ask the xdg-desktop-portal Settings interface instead, which
#   serves the GSettings value. That is set from config/sway/config — see the
#   `gsettings set` block there. Both halves are needed; neither is sufficient.
#
# Verify what a GTK3 app actually resolved, from inside a sway session:
#   python3 -c 'import gi; gi.require_version("Gtk","3.0"); from gi.repository import Gtk; \
#     print(Gtk.Settings.get_default().get_property("gtk-application-prefer-dark-theme"))'

[Settings]
# ⚠ This, NOT gtk-theme-name=Adwaita-dark. Both produce a dark window, but the
# dark *variant* flag is what GTK3 propagates to apps that ask "am I dark?",
# and it is what a theme with only one directory (adw-gtk3, if ever installed)
# can act on. Naming the -dark theme instead pins the theme and loses that.
gtk-application-prefer-dark-theme=1
gtk-theme-name=Adwaita

# Adwaita is the only complete icon theme installed (`ls /usr/share/icons`);
# hicolor is the spec's fallback namespace, not a theme. Papirus is deliberately
# not assumed here — see the note in config/mako/config.
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24

# The desktop's real UI font, matching what sway-calendar picks and what
# GSettings already reports. NOT IosevkaTerm: that is the terminal/bar font, and
# a monospace face in a GTK dialog is the opposite of the look being aimed for.
gtk-font-name=Cantarell 11

gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb

# CSD titlebar buttons: close only. Minimise and maximise are meaningless under
# a tiling compositor — there is no taskbar to minimise into, and $mod+f already
# owns fullscreen — so they are three pixels of decoration that do nothing.
# Revert with `:minimize,maximize,close`.
gtk-decoration-layout=:close
